plugins {
    id 'java'
}

group = 'com.javastudio'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    flatDir {
        dirs '.libs'
    }
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "spigotmc"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "extendedclip"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly fileTree(dir: '.libs', include: ['*.jar'])
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
    compileOnly 'net.kyori:adventure-api:4.17.0'
    compileOnly 'net.kyori:adventure-key:4.17.0'
    compileOnly 'net.kyori.examination:examination-api:1.3.0'
    compileOnly 'net.kyori.examination:examination-string:1.3.0'
    compileOnly 'net.md-5:bungeecord-chat:1.20-R0.2'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.mojang:brigadier:1.0.18'
    compileOnly 'io.netty:netty-transport:4.1.100.Final'
    compileOnly 'io.netty:netty-buffer:4.1.100.Final'
    compileOnly 'io.netty:netty-common:4.1.100.Final'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add("-parameters")
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

sourceSets {
    webExtension {
        java.srcDirs = ['web-extension/src/main/java']
        resources.srcDirs = ['web-extension/src/main/resources']
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

tasks.register('webJar', Jar) {
    dependsOn classes, compileWebExtensionJava, processWebExtensionResources
    archiveBaseName.set('JavaStudio-Web')
    archiveVersion.set(project.version.toString())
    from sourceSets.webExtension.output
}

tasks.named('assemble') {
    dependsOn tasks.named('webJar')
}
